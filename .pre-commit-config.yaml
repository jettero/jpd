default_stages:
- push
fail_fast: true
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: check-yaml
    exclude: 'old/'
  - id: end-of-file-fixer
    exclude: 'old/'
  - id: trailing-whitespace
    exclude: 'old/'
- repo: https://github.com/pycqa/pylint
  rev: v3.0.1
  hooks:
  - id: pylint
    files: 'space/'
- repo: https://github.com/psf/black
  rev: 23.9.1
  hooks:
  - id: black
    exclude: 'old/'
- repo: local
  hooks:
  - id: pip-compile
    name: Update requirements.txt
    entry: pip-compile -r pyproject.toml
    language: system
    files: '^pyproject\.toml$'
